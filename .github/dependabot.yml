# Weekly, one grouped PR per ecosystem, titled `chore(deps): …` so it passes the PR title check.
# NuGet is left out on purpose: Roslyn versions in the generator/analyzer projects are pinned to what Unity ships, and a
# bump must come with the rebuilt DLLs (scripts/build-roslyn-dlls.sh), which Dependabot cannot commit.
# Actions are pinned by full commit SHA with a `# vX.Y.Z` comment; Dependabot moves both. Pin a new action the same way.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /Docs
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies]
    open-pull-requests-limit: 1
    groups:
      docs:
        patterns: ['*']
        update-types: [minor, patch]
