name: Claude Code

# Two jobs:
# - review: one automatic review when a PR opens or leaves draft.
#   We do not review every push to save subscription limits.
#   Ask for a new review with an @claude comment.
# - mention: answers @claude comments in PRs and issues, and issues that mention @claude.
#   A requested review also leaves inline comments.
#   Comments from bots are ignored, so Claude's own replies do not start it again.
#   Only the owner, members and collaborators can start it (author_association).
#   The action checks write access too, but only after the job has taken a runner and a write token.
#
# Both jobs append .github/claude-review.md to the system prompt.
# A step reads the file before the action switches to the PR branch:
# older PR branches may not have the file yet.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (Pro/Max subscription).
# CLAUDE_CODE_SUBPROCESS_ENV_SCRUB=1 hides that token from the Bash commands Claude runs.
# GitHub tokens stay in their environment, so `gh` works; keep the permissions of each job narrow.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  review:
    # Fork and Dependabot PRs get no Actions secrets, so the review would fail on them.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # The mention job repeats these steps and the action env through the YAML anchors below.
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - &rules
        name: Read review rules
        id: rules
        run: |
          {
            echo 'text<<CLAUDE_RULES_EOF'
            cat .github/claude-review.md
            echo 'CLAUDE_RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - &bubblewrap
        name: Prepare bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Review PR
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env: &claude-env
          # The action reads this variable and appends it to the system prompt.
          APPEND_SYSTEM_PROMPT: ${{ steps.rules.outputs.text }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No track_progress: the action would put the result into an edit of its progress comment.
          # An edit does not notify a session that waits for the review, a new comment does.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request.
            Post the inline comments first. Then post the main comment with `gh pr comment`.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: |
      github.event.sender.type != 'Bot' && (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) || (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
        ) || (
          github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - *checkout
      - *rules
      - *bubblewrap

      - name: Run Claude
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env: *claude-env
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The inline comment tool lets a requested review put issues on their lines.
          # git diff and git fetch let Claude see what the PR changed against its base.
          # gh pr comment posts the result of a requested review as a new comment;
          # gh pr view reads the labels the review rules check.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git fetch:*),Bash(gh pr comment:*),Bash(gh pr view:*)"
