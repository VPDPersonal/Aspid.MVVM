name: Docs

# Builds the Docusaurus site in Docs/ and publishes it to GitHub Pages.
# Content lives in Docs/ (docs/, tutorials/, i18n/) and the root changelogs, so any change there rebuilds the site.

on:
  push:
    branches: [main]
    paths:
      - 'Docs/**'
      - 'CHANGELOG*.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'Docs/**'
      - 'CHANGELOG*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pages show their last update date, read from the git history.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Docs/package-lock.json
      - run: npm ci
        working-directory: Docs
      - run: npm test
        working-directory: Docs
      - run: npm run build
        working-directory: Docs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: Docs/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job may publish to Pages; the build job, PR runs included, reads the repository only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
