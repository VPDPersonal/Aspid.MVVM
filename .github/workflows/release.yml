name: Release

# Publishes a release for a pushed v* tag. A stable version (1.2.0) updates the `upm` branch, a prerelease
# (1.2.0-rc.1, 1.2.0-beta.3, ...) updates `upm-preview`; both get an immutable upm/<version> tag for pinning.
# Everything is checked before anything is published: first the checks of the tag (preflight), then every check and
# test of a pull request (ci.yml, Unity not skipped); the UPM branch and its tag then go out in one atomic push
# (release), and the GitHub release is created last, in its own job (github-release).
# If a job fails, use "Re-run failed jobs", not "Re-run all jobs": the finished jobs are kept, and preflight would
# refuse the UPM tag that the first run already published.
# There is no manual run: the "Release tags" ruleset lets only admins create, move or delete v* tags, and a personal
# repository cannot add the workflow token to the bypass list, so the workflow could not push the tag itself.
# scripts/set-version.sh prepares the release PR; the asp-mvvm-release skill walks the whole release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PACKAGE_PATH: Aspid.MVVM/Packages/tech.aspid.mvvm
  # CHANGELOG / MIGRATION are canonical at the repository root (so they surface on the GitHub landing page). They are
  # copied into the package at publish time, see the "Bundle release docs into the package" step.
  CHANGELOG_PATH: CHANGELOG.md

jobs:
  # The tag checks run first, so a wrong ref, version or CHANGELOG fails before CI starts. The version files and the
  # committed DLLs are checked in CI, as in every pull request.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      upm-branch: ${{ steps.version.outputs.upm-branch }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not a valid SemVer string."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            UPM_BRANCH=upm-preview
          else
            PRERELEASE=false
            UPM_BRANCH=upm
          fi
          # Validated as SemVer above, so the later steps and the release job can read these.
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "PRERELEASE=$PRERELEASE"
            echo "UPM_BRANCH=$UPM_BRANCH"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "upm-branch=$UPM_BRANCH"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION to $UPM_BRANCH"

      # The checks below need every commit and tag, and no blob outside the tagged commit: the blob filter skips the
      # history of the DLLs and media.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # A v* tag can be pushed on any commit, for example one of an open PR. Only a commit that main already contains
      # is published. This catches a mistake, not abuse: the workflow file comes from the tagged commit.
      - name: Check the commit is in main
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Commit $(git rev-parse --short HEAD) is not in main. Delete the tag, merge the commit into main, then tag the merge commit."
            exit 1
          fi
          echo "Commit $(git rev-parse --short HEAD) is in main."

      # The pushed v* tag is the trigger itself; only the UPM tag must be new. Both channels share the upm/ prefix.
      # The checkout fetched every tag of origin a moment ago, and the atomic push of the release job refuses an
      # existing tag anyway.
      - name: Check the UPM tag does not already exist
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/upm/$VERSION" >/dev/null; then
            echo "::error::Tag upm/$VERSION already exists on origin. Refusing to overwrite a published tag."
            exit 1
          fi

      - name: Validate package.json version
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error file=$PACKAGE_PATH/package.json::package.json version ($PKG_VERSION) does not match release version ($VERSION). Bump it before tagging (scripts/set-version.sh)."
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Extract CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error file=$CHANGELOG_PATH::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before releasing (scripts/set-version.sh)."
            exit 1
          fi

          {
            echo 'notes<<RELEASE_NOTES_EOF'
            printf '%s\n' "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "CHANGELOG section for $VERSION extracted ($(echo "$NOTES" | wc -l) lines)."

  # Every check and test of CI on the commit being released; here missing Unity secrets fail instead of skipping Unity.
  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      require-unity: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    # A called workflow gets no more than these: a job of ci.yml that asks for more (actions: read of unity-plan)
    # makes the whole run a startup failure.
    permissions:
      actions: read
      contents: read

  release:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      UPM_BRANCH: ${{ needs.preflight.outputs.upm-branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The published package ships CHANGELOG and MIGRATION too (the Changelog link of the Package Manager). They are
      # copied into the package and committed here, so the subtree split below publishes them. The commit stays in
      # this runner: the release tag points at $GITHUB_SHA.
      - name: Bundle release docs into the package
        run: |
          set -euo pipefail
          for f in CHANGELOG.md CHANGELOG.ru.md MIGRATION.md MIGRATION.ru.md; do
            if [[ -f "$f" ]]; then
              cp "$f" "$PACKAGE_PATH/$f"
              git add --force "$PACKAGE_PATH/$f"
            fi
          done
          git commit --quiet -m "chore(release): bundle the changelog and migration guide into the package for $TAG"

      # One atomic push: the UPM branch and its tag are both published, or neither is.
      - name: Publish UPM subtree
        run: |
          set -euo pipefail
          UPM_TAG="upm/$VERSION"
          UPM_SHA=$(git subtree split --prefix="$PACKAGE_PATH" HEAD)
          echo "UPM subtree split SHA: $UPM_SHA"
          git tag "$UPM_TAG" "$UPM_SHA"
          git push --atomic origin "+$UPM_SHA:refs/heads/$UPM_BRANCH" "refs/tags/$UPM_TAG"
          echo "Published $UPM_TAG and the $UPM_BRANCH branch."

  # The gh CLI instead of a third-party action, which would run with this job's contents: write token.
  # A separate job: the tags are out when it starts, so a failure here is repaired with "Re-run failed jobs",
  # which runs only this job. Creating the release by hand works too:
  #   gh release create v<version> --verify-tag --title v<version> --prerelease=<true|false> \
  #     --notes-file <the version's section of CHANGELOG.md>
  github-release:
    name: GitHub release
    needs: [preflight, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.preflight.outputs.tag }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      NOTES: ${{ needs.preflight.outputs.notes }}

    steps:
      # No checkout: --verify-tag asks the GitHub API whether the tag is out.
      - name: Create GitHub release
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
