name: Release

# Stable releases (1.2.0) update the `upm` branch.
# Pre-release versions (1.2.0-rc.1, 1.2.0-alpha.3, 1.2.0-preview.2, ...) update `upm-preview`.
# Both create an immutable upm/<version> tag for pinning.
#
# Trigger: push a `v*` tag, or run manually via "Run workflow" with the version as input.
#
# Everything is checked before anything is published: first the checks of the version (preflight), then every check
# and test of a pull request (ci.yml, Unity not skipped: the committed Roslyn DLLs, the .NET tests, the Unity tests on
# every version); the release job publishes last.
# If a job fails, use "Re-run failed jobs", not "Re-run all jobs": the finished jobs are kept.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.0 or 1.2.0-rc.1)'
        required: true
        type: string

env:
  PACKAGE_PATH: Aspid.MVVM/Packages/tech.aspid.mvvm
  # CHANGELOG / MIGRATION are canonical at the repository root (so they surface
  # on the GitHub landing page). They are copied into the package at publish
  # time — see the "Bundle release docs into the package" step.
  CHANGELOG_PATH: CHANGELOG.md
  STABLE_BRANCH: upm
  PREVIEW_BRANCH: upm-preview

permissions:
  contents: write

jobs:
  # The version checks run first, so a wrong version, tag or CHANGELOG fails before CI starts.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      target_branch: ${{ steps.version.outputs.target_branch }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - name: Determine version and channel
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid SemVer version: '$VERSION'"
            exit 1
          fi

          TAG="v$VERSION"
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL="preview"
            TARGET_BRANCH="${PREVIEW_BRANCH}"
            PRERELEASE="true"
          else
            CHANNEL="stable"
            TARGET_BRANCH="${STABLE_BRANCH}"
            PRERELEASE="false"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "target_branch=$TARGET_BRANCH"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $VERSION (channel=$CHANNEL, branch=$TARGET_BRANCH, tag=$TAG)"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Ensure release tag does not already exist
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists locally"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin"
            exit 1
          fi

      - name: Ensure UPM tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          UPM_TAG="upm/$VERSION"
          if git ls-remote --exit-code --tags origin "$UPM_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $UPM_TAG already exists on origin"
            exit 1
          fi

      - name: Validate package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version "$PACKAGE_PATH/package.json")
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release version ($VERSION)"
            exit 1
          fi
          echo "package.json version matches: $PKG_VERSION"

      - name: Extract CHANGELOG section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "::error::CHANGELOG file not found at $CHANGELOG_PATH"
            exit 1
          fi
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if ($0 ~ "^## \\[" ver "\\]([^0-9A-Za-z.-]|$)") { capture = 1; next }
            }
            capture { print }
          ' "$CHANGELOG_PATH")
          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "::error::No CHANGELOG section found for version $VERSION (expected '## [$VERSION]' in $CHANGELOG_PATH)"
            exit 1
          fi
          {
            echo "notes<<__CHANGELOG_EOF__"
            echo "$NOTES"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

  # Every check and test of CI on the commit being released; here missing Unity secrets fail instead of skipping Unity.
  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      require-unity: true
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    # A called workflow gets no more than these: a job of ci.yml that asks for more (actions: read of unity-plan)
    # makes the whole run a startup failure.
    permissions:
      actions: read
      contents: read

  release:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      CHANNEL: ${{ needs.preflight.outputs.channel }}
      TARGET_BRANCH: ${{ needs.preflight.outputs.target_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Checkout release tag
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --no-tags 2>/dev/null || true
          git checkout "$TAG"

      - name: Bundle release docs into the package
        # CHANGELOG / MIGRATION live at the repo root, but the published UPM
        # package should still ship them (Package Manager's Changelog tab, etc.).
        # Copy them into the package subtree and commit on the detached release
        # checkout so the following `git subtree split` picks them up. The commit
        # is throwaway — it only exists to seed the split SHA.
        run: |
          set -euo pipefail
          for f in CHANGELOG.md CHANGELOG.ru.md MIGRATION.md MIGRATION.ru.md; do
            if [[ -f "$f" ]]; then
              cp "$f" "$PACKAGE_PATH/$f"
              git add -f "$PACKAGE_PATH/$f"
            fi
          done
          git commit -m "chore(release): bundle changelog and migration into package" || echo "Nothing to bundle"

      - name: Publish UPM subtree
        run: |
          set -euo pipefail
          UPM_TAG="upm/$VERSION"

          SPLIT_SHA=$(git subtree split --prefix="$PACKAGE_PATH" HEAD)
          echo "Subtree split SHA: $SPLIT_SHA"

          git push --force origin "$SPLIT_SHA:refs/heads/$TARGET_BRANCH"
          git tag "$UPM_TAG" "$SPLIT_SHA"
          git push origin "$UPM_TAG"

          echo "Published $UPM_TAG to branch '$TARGET_BRANCH' (channel: $CHANNEL)"

      # The gh CLI instead of a third-party action, which would run with this job's contents: write token.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.preflight.outputs.notes }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
